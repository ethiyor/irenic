name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements-hosted.lock
      - run: python -m unittest discover -s pipeline -p test_outreach_hosted.py
      - run: python -m unittest discover -s pipeline -p test_email_login.py
      - run: python -m unittest discover -s pipeline -p test_workspaces.py
      - run: python -m unittest discover -s pipeline -p test_outreach_live.py
      - run: python -m unittest discover -s pipeline -p test_gmail_pacing.py
      - run: python -m unittest discover -s pipeline -p test_outreach_console.py
      - run: python -m unittest discover -s pipeline -p test_migrate_outreach.py
